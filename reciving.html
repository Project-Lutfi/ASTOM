<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receiving - Data Barang yang Dikirim</title>
    <!-- Memuat Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Memuat Bootstrap Icons & FontAwesome untuk ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            font-size: 13px;
        }
        .table-custom th {
            background-color: #ffffff;
            color: #000;
            font-weight: bold;
            font-size: 11px;
            border-bottom: 2px solid #0d6efd;
            vertical-align: middle;
            text-align: center;
        }
        .table-custom td {
            vertical-align: middle;
            background-color: #ffffff;
        }
        .box-placeholder {
            border: 1.5px solid #0056b3;
            color: #000;
            text-align: center;
            padding: 8px;
            background-color: #fff;
            font-weight: 500;
        }
    </style>
</head>
<body class="p-4">

    <div class="container-fluid">
        <!-- Judul Bagian Atas -->
        <div class="fw-bold mb-3" style="font-size: 14px;">Data Barang yang Dikirim</div>

        <!-- Bagian Filter & Tombol Atas -->
        <div class="row align-items-center mb-3">
            <div class="col-auto">
                <button class="btn btn-info text-white px-3 py-1 fw-bold" style="background-color: #00bfff; border: none;">
                    <i class="fa fa-search me-1"></i> Cari
                </button>
            </div>
            <div class="col text-end d-flex justify-content-end align-items-center">
                <span class="me-2 fw-normal">Periode Bulan</span>
                <div class="input-group" style="width: 160px;">
                    <input type="text" class="form-control form-control-sm rounded-0 border-dark">
                    <span class="input-group-text bg-white rounded-0 border-dark"><i class="fa fa-calendar text-secondary"></i></span>
                </div>
                <button class="btn btn-danger btn-sm ms-2 fw-bold px-3 rounded-0" style="background-color: #ff0000;">Tampilkan</button>
            </div>
        </div>

        <!-- Tabel Data -->
        <div class="table-responsive">
            <table class="table table-bordered table-custom m-0">
                <thead>
                    <tr>
                        <th style="width: 30px;"><input type="checkbox" class="form-check-input m-0"></th>
                        <th>KODE BARANG</th>
                        <th>URAIAN BARANG</th>
                        <th>JUMLAH</th>
                        <th>SATUAN</th>
                        <th>ASET NO</th>
                        <th>STATUS</th>
                        <th>PERUSAHAAN</th>
                        <th>KODE DOC</th>
                        <th>NOMOR AJU</th>
                        <th>NOMOR DAFTAR</th>
                        <th>TGL. DAFTAR</th>
                        <th>AKSI</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="text-center">
                            <input type="checkbox" class="form-check-input border-dark">
                        </td>
                        <td colspan="7" class="p-1">
                            <div class="box-placeholder">DATA MASUK SETELAH DIPILIH</div>
                        </td>
                        <td colspan="4" class="p-1">
                            <div class="box-placeholder">&nbsp;</div>
                        </td>
                        <td class="text-center p-2">
                            <div class="d-flex justify-content-center gap-1 align-items-center">
                                <button class="btn btn-outline-secondary btn-sm px-2 py-1 fw-bold" style="font-size: 11px;">GATE</button>
                                <button class="btn btn-outline-secondary btn-sm px-2 py-1 fw-bold" style="font-size: 11px;">ADD</button>
                                <button class="btn btn-info btn-sm text-white px-2 py-1" style="background-color: #5bc0de; border: none;"><i class="fa fa-eye"></i></button>
                                <button class="btn btn-danger btn-sm px-2 py-1" style="background-color: #ff0000; border: none;"><i class="fa fa-trash"></i></button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
