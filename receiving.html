<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receiving Mold/Dies [IN]</title>
    <!-- Menggunakan Font Awesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            margin: 20px;
            color: #000;
        }

        /* Title */
        h2 {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        /* Subtitle */
        .subtitle {
            font-size: 14px;
            margin-bottom: 15px;
        }

        /* Filter Controls Section */
        .controls-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        /* Buttons */
        .btn {
            border: none;
            border-radius: 4px;
            padding: 6px 12px;
            font-size: 13px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .btn-cari {
            background-color: #00a0e9;
            color: white;
            padding: 6px 16px;
        }

        .btn-tampilkan {
            background-color: #ff0000;
            color: white;
            font-weight: bold;
            padding: 4px 12px;
        }

        /* Date Picker Input Group */
        .filter-periode {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 13px;
        }

        .date-input-wrapper {
            position: relative;
            display: inline-block;
        }

        .date-input-wrapper input {
            padding: 3px 25px 3px 5px;
            border: 1px solid #000;
            outline: none;
            font-size: 13px;
            width: 120px;
        }

        /* Table Styling */
        .table-container {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        th {
            text-align: left;
            padding: 8px 5px;
            font-weight: bold;
            white-space: nowrap;
        }

        th.center {
            text-align: center;
        }

        td {
            padding: 4px;
            background-color: #f2f2f2;
        }

        /* Custom Inner Boxes for Table Cells */
        .data-box {
            border: 1px solid #005c8a;
            background-color: #f8f9fa;
            text-align: center;
            padding: 4px 0;
            font-size: 12px;
            color: #333;
        }

        .checkbox-col {
            width: 25px;
            text-align: center;
            vertical-align: middle;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-action-outline {
            border: 1px solid #ccc;
            background-color: #fff;
            color: #333;
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 3px;
            cursor: pointer;
        }

        .btn-icon {
            border: none;
            padding: 5px 8px;
            border-radius: 3px;
            cursor: pointer;
            color: white;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-view {
            background-color: #b3e5fc;
            color: #000;
        }

        .btn-delete {
            background-color: #ff0000;
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- Header Title -->
    <h2>RECIVING MOLD/DIES [IN]</h2>

    <!-- Subtitle -->
    <div class="subtitle">Data Barang yang Dikirim</div>

    <!-- Filter & Controls -->
    <div class="controls-container">
        <button class="btn btn-cari">
            <i class="fa-solid fa-magnifying-glass"></i> Cari
        </button>

        <div class="filter-periode">
            <label for="periode">Periode Bulan :</label>
            <div class="date-input-wrapper">
                <input type="month" id="periode">
            </div>
            <button class="btn btn-tampilkan">Tampilkan</button>
        </div>
    </div>

    <!-- Table Section -->
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th class="checkbox-col"></th>
                    <th>KODE BARANG</th>
                    <th>URAIAN BARANG</th>
                    <th>JUMLAH</th>
                    <th>SATUAN</th>
                    <th>ASET NO</th>
                    <th>STATUS</th>
                    <th>PERUSAHAAN</th>
                    <th>KODE DOC</th>
                    <th>NOMOR AJU</th>
                    <th>NOMOR DAFTAR</th>
                    <th>TGL. DAFTAR</th>
                    <th class="center">AKSI</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td class="checkbox-col">
                        <input type="checkbox">
                    </td>
                    <!-- Kolom gabungan pertama -->
                    <td colspan="8">
                        <div class="data-box">
                            DATA MASUK SETELAH DIPILIH
                        </div>
                    </td>
                    <!-- Kolom gabungan kedua -->
                    <td colspan="3">
                        <div class="data-box" style="height: 16px;"></div>
                    </td>
                    <!-- Tombol Aksi -->
                    <td>
                        <div class="action-buttons">
                            <button class="btn-action-outline">GATE</button>
                            <button class="btn-action-outline">ADD BC</button>
                            <button class="btn-icon btn-view">
                                <i class="fa-regular fa-eye"></i>
                            </button>
                            <button class="btn-icon btn-delete">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>
