<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASTOM Portal Login</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Custom style untuk gambar latar belakang pada panel kanan */
    .hero-bg {
      background-image: url('https://images.unsplash.com/photo-1556742049-0a67f572c9ee?auto=format&fit=crop&q=80&w=1000');
      background-size: cover;
      background-position: center;
    }
  </style>
</head>
<body class="bg-gray-200 font-sans text-gray-800 antialiased min-h-screen flex flex-col">

  <!-- Header Navigation -->
  <header class="bg-[#002d62] text-white text-xs py-2 px-6 flex items-center justify-between">
    <div class="flex items-center space-x-6">
      <a href="#" class="hover:underline">Beacukai.go.id</a>
      <a href="#" class="hover:underline">Helpdesk</a>
    </div>
  </header>

  <!-- Banner Pengumuman -->
  <div class="bg-[#ffcb05] text-black text-xs font-semibold py-2.5 px-6 flex items-center justify-between shadow-sm">
    <div class="flex items-center gap-2">
      <i class="fa-solid fa-triangle-exclamation text-amber-800"></i>
      <span>Pengumuman</span>
    </div>
    <button type="button" class="bg-[#00a8e8] text-white rounded-sm w-4 h-4 flex items-center justify-center text-[10px]">
      <i class="fa-solid fa-caret-up"></i>
    </button>
  </div>

  <!-- Main Container -->
  <main class="flex-1 flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-xl max-w-4xl w-full flex flex-col md:flex-row overflow-hidden border border-gray-100">
      
      <!-- Left Panel: Form Login -->
      <div class="w-full md:w-1/2 p-8 sm:p-10 flex flex-col justify-between">
        <div>
          <!-- Badge User Manual -->
          <div class="inline-block bg-[#002b5b] text-white text-xs px-3 py-1.5 rounded-r-md font-medium mb-6 -ml-8 sm:-ml-10 shadow-sm">
            Klik disini untuk memulai (User Manual)
          </div>

          <!-- Tabs (Public vs Personal) -->
          <div class="flex border-b border-gray-200 mb-6 text-xs font-semibold">
            <button class="pb-2 px-1 text-[#00a8e8] border-b-2 border-[#00a8e8] mr-6">Public</button>
            <button class="pb-2 px-1 text-gray-400 hover:text-gray-600">Personal</button>
          </div>

          <!-- Logo & Title -->
          <div class="mb-6">
            <div class="flex items-center gap-1.5 text-[#002d62] font-black text-2xl tracking-tighter">
              <i class="fa-solid fa-person-walking-arrow-right text-emerald-500 text-xl"></i>
              <span>ceısa</span>
            </div>
            <p class="text-[9px] text-gray-400 font-mono tracking-widest uppercase -mt-1">Connected | Integrated | Automated</p>
            <h1 class="text-xl font-bold text-[#002d62] mt-4">CEISA Portal Login</h1>
          </div>

          <!-- Form Input -->
          <form class="space-y-3" onsubmit="event.preventDefault();">
            <!-- Username Input -->
            <div class="relative">
              <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400 text-xs">
                <i class="fa-regular fa-user"></i>
              </span>
              <input 
                type="text" 
                value="incoming"
                placeholder="Username" 
                class="w-full pl-9 pr-3 py-2 bg-[#edf4ff] border border-[#cce0ff] rounded-md text-xs text-gray-700 focus:outline-none focus:ring-1 focus:ring-blue-500"
              >
            </div>

            <!-- Password Input -->
            <div class="relative">
              <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400 text-xs">
                <i class="fa-solid fa-lock"></i>
              </span>
              <input 
                type="password" 
                value="123456789"
                placeholder="Password" 
                class="w-full pl-9 pr-3 py-2 bg-[#edf4ff] border border-[#cce0ff] rounded-md text-xs text-gray-700 focus:outline-none focus:ring-1 focus:ring-blue-500"
              >
            </div>

            <!-- Log In Button -->
            <button 
              type="submit" 
              class="w-full bg-[#00a8e8] hover:bg-[#0092cd] text-white font-medium py-2 rounded-md text-xs transition shadow-sm mt-1"
            >
              Log in
            </button>
          </form>

          <!-- Divider -->
          <div class="relative my-6 text-center">
            <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-200"></div></div>
            <span class="relative bg-white px-3 text-[11px] text-gray-400">Belum Punya Akses?</span>
          </div>

          <!-- Register Button -->
          <button 
            type="button" 
            class="w-full bg-[#2b6cb0] hover:bg-[#235893] text-white font-medium py-2 rounded-md text-xs transition shadow-sm"
          >
            Daftar
          </button>
        </div>

        <!-- Footer Links -->
        <div class="mt-8 text-[11px] text-gray-500">
          Tidak bisa login? 
          <a href="#" class="font-semibold text-[#002d62] hover:underline">Reset Password</a> / 
          <a href="#" class="font-semibold text-[#002d62] hover:underline">Belum Dapat Email Konfirmasi</a>
        </div>
      </div>

      <!-- Right Panel: Image Display -->
      <div class="hidden md:block w-1/2 hero-bg relative">
        <div class="absolute inset-0 bg-black/10"></div>
      </div>

    </div>
  </main>

</body>
</html>
